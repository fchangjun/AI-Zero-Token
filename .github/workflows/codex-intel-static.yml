name: Codex intelligence · GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'sites/codex-reset/**'
      - '.github/workflows/codex-intel-static.yml'
  pull_request:
    paths:
      - 'sites/codex-reset/**'
      - '.github/workflows/codex-intel-static.yml'

permissions:
  contents: read

concurrency:
  group: codex-intel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: sites/codex-reset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Read GitHub Pages URL
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
      - run: npm run package:static
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://fchangjun.github.io/AI-Zero-Token/' }}
          SITE_INDEXABLE: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: codex-intel-static
          path: sites/codex-reset/outputs/codex-intel-static.zip
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites/codex-reset/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: static-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
